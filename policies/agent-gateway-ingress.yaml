# Agent Gateway in Client-to-Agent (ingress) mode
# Controls which clients can invoke your deployed agents and enforces
# ingress guardrails (such as Model Armor prompt-injection & PII checks).
#
# Import with:
#   gcloud network-services agent-gateways import travel-agent-ingress-gateway \
#     --source=policies/agent-gateway-ingress.yaml \
#     --location=$REGION
name: travel-agent-ingress-gateway
protocols:
  - MCP
googleManaged:
  governedAccessPath: CLIENT_TO_AGENT
