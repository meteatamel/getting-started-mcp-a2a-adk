# IAP Authorization Extension for Agent-to-Anywhere egress gateway.
# Starts in DRY_RUN (audit-only) mode per Google Cloud best practices so you
# can audit outbound traffic before enforcing IAM Unified Access Policies (UAPs).
# Remove `iamEnforcementMode: "DRY_RUN"` once your UAPs are in place.
name: travel-agent-iap-authz-ext
service: iap.googleapis.com
failOpen: false
timeout: 1s
metadata:
  iapPolicyVersion: "V2"
  iamEnforcementMode: "DRY_RUN"
