# Content Authorization Policy (CONTENT_AUTHZ) attaching Model Armor to the
# Agent-to-Anywhere egress gateway to inspect outbound A2A/MCP payloads.
#
# Substitute PROJECT_ID and REGION before importing:
#   envsubst < policies/model-armor-policy.yaml > /tmp/model-armor-policy.yaml
#   gcloud network-security authz-policies import travel-agent-model-armor-policy \
#     --source=/tmp/model-armor-policy.yaml \
#     --location=$REGION
name: travel-agent-model-armor-policy
target:
  resources:
    - "projects/${PROJECT_ID}/locations/${REGION}/agentGateways/travel-agent-egress-gateway"
policyProfile: CONTENT_AUTHZ
action: CUSTOM
customProvider:
  authzExtension:
    resources:
      - "projects/${PROJECT_ID}/locations/${REGION}/authzExtensions/travel-agent-model-armor-ext"
httpRules:
  - to:
      operations:
        - paths:
            - prefix: "/"
    when: >-
      request.headers['content-type'].startsWith('application/json') ||
      request.headers['content-type'].startsWith('text/')
